<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barovia – Curse of Strahd</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <div id="map"></div>

    <div id="coord-box">X: 0 | Y: 0</div>

    <div id="user-stats-container">
        <div id="user-count">
            <i class="fa-solid fa-ghost"></i> Souls in the Mists: <span id="count-num">0</span>
            <div id="user-list-popup">
                <strong>Active Travelers:</strong>
                <hr style="border: 0; border-top: 1px dashed #5e0000; margin: 5px 0;">
                <div id="names-list">Loading...</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="gm-toggle">Dungeon Master: OFF</button>
        <button id="hide-toggle">Hide Markers</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
</body>

</html>
